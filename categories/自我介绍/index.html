          <div id="fps" style="
          position: fixed;
          bottom: 20px;
          left: 20px;
          z-index: 10000;
          padding: 4px 12px;
          background: rgba(0, 0, 0, 0.4);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 12px;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
          color: #00ff00;
          font-size: 13px;
          font-family: 'Monaco', 'Consolas', monospace;
          font-weight: bold;
          pointer-events: none;
          display: flex;
          align-items: center;
          transition: color 0.3s ease;
          ">
            <span id="fps-dot"
              style="width: 8px; height: 8px; background: currentColor; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 8px currentColor;"></span>
            <span id="fps-text">FPS: 60</span>
          </div>
          <canvas id="fireworks"
            style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:99999"></canvas>

          <script>
            var OriginTitle = document.title;
            var titleTime;
            document.addEventListener('visibilitychange', function () {
              if (document.hidden) {
                document.title = '快回来呀 ヾ(≧へ≦)〃';
                clearTimeout(titleTime);
              } else {
                document.title = '欢迎光临 ヾ(≧▽≦*)o';
                titleTime = setTimeout(function () { document.title = OriginTitle; }, 1000);
              }
            });
            // 增强版 FPS 实时变色逻辑
            (function () {
              var fpsElement = document.getElementById('fps');
              var fpsText = document.getElementById('fps-text');
              var lastTime = performance.now(), frames = 0;

              function update() {
                var now = performance.now();
                frames++;
                if (now > 1000 + lastTime) {
                  var fps = Math.round((frames * 1000) / (now - lastTime));
                  fpsText.innerHTML = 'FPS: ' + fps;

                  // --- 动态根据帧率改变主题色 ---
                  if (fps >= 55) {
                    fpsElement.style.color = '#00ff00'; // 满血丝滑：翠绿
                  } else if (fps >= 30) {
                    fpsElement.style.color = '#ffaa00'; // 稍有压力：明橙
                  } else {
                    fpsElement.style.color = '#ff4444'; // 严重掉帧：警示红
                  }

                  frames = 0;
                  lastTime = now;
                }
                requestAnimationFrame(update);
              }
              update();
            })();
            const canvas = document.getElementById('fireworks');
            const ctx = canvas.getContext('2d');
            let particles = [];
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            window.addEventListener('mousemove', (e) => {
              for (let i = 0; i < 2; i++) {
                particles.push({
                  x: e.clientX, y: e.clientY, size: Math.random() * 3 + 1,
                  spX: (Math.random() - 0.5) * 2, spY: (Math.random() - 0.5) * 2,
                  color: `hsl(${Math.random() * 360}, 50%, 50%)`, alpha: 1
                });
              }
            });
            function animate() {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              particles.forEach((p, i) => {
                p.x += p.spX; p.y += p.spY; p.alpha -= 0.02;
                if (p.alpha <= 0) return particles.splice(i, 1);
                ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
              });
              requestAnimationFrame(animate);
            }
            animate();
          </script>
