<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji 组合器</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #2c3e50;
      --panel-bg: #f8f9fa;
      --border: #e9ecef;
      --card-bg: #ffffff;
      --btn-color: #ff9800;
      --btn-hover: #f57c00;
      --highlight: #e65100;
    }

    body.dark-mode {
      --bg: #121212;
      --text: #e0e0e0;
      --panel-bg: #1e1e1e;
      --border: #333333;
      --card-bg: #2d2d2d;
      --btn-color: #ffb74d;
      --btn-hover: #ffa726;
      --highlight: #ffcc80;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      margin: 0 0 5px 0;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 1px;
    }

    p {
      font-size: 14px;
      margin: 0 0 25px 0;
      opacity: 0.7;
    }

    .control-panel {
      background: var(--panel-bg);
      padding: 25px;
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .selectors {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .emoji-picker-container {
      position: relative;
      flex: 1;
    }

    .picker-label {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    .emoji-selector-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px 5px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      user-select: none;
    }

    .emoji-selector-btn:hover {
      border-color: var(--btn-color);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 152, 0, 0.15);
    }

    .current-e {
      font-size: 32px;
      line-height: 1;
    }

    .current-n {
      font-size: 12px;
      color: var(--text);
      opacity: 0.7;
      margin-top: 8px;
      font-weight: bold;
    }

    .emoji-grid-popup {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      width: 280px;
      max-height: 250px;
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding: 12px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .emoji-grid-popup.show {
      display: grid;
      opacity: 1;
    }

    .grid-item {
      font-size: 28px;
      text-align: center;
      padding: 8px 0;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.2s, transform 0.1s;
    }

    .grid-item:hover {
      background: var(--panel-bg);
      transform: scale(1.15);
    }

    .emoji-grid-popup::-webkit-scrollbar {
      width: 6px;
    }

    .emoji-grid-popup::-webkit-scrollbar-thumb {
      background: #dcdcdc;
      border-radius: 4px;
    }

    .emoji-grid-popup::-webkit-scrollbar-thumb:hover {
      background: #c0c0c0;
    }

    body.dark-mode .emoji-grid-popup::-webkit-scrollbar-thumb {
      background: #555;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .btn {
      flex: 3;
      background: var(--btn-color);
      color: #fff;
      padding: 16px;
      text-align: center;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 2px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      box-shadow: 0 6px 15px rgba(255, 152, 0, 0.3);
    }

    .btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 152, 0, 0.4);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.theme-btn {
      flex: 1;
      background: var(--card-bg);
      color: var(--text);
      border: 2px solid var(--border);
      box-shadow: none;
      font-size: 20px;
      padding: 10px;
    }

    .btn.theme-btn:hover {
      background: var(--panel-bg);
      border-color: var(--text);
    }

    .result-card {
      background: var(--card-bg);
      padding: 30px 25px;
      border-radius: 16px;
      border: 2px dashed var(--btn-color);
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 15px;
      margin-top: 25px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(10px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .formula {
      font-size: 38px;
      letter-spacing: 5px;
      margin-bottom: 5px;
    }

    .creature-name {
      font-size: 24px;
      font-weight: 900;
      color: var(--highlight);
      margin: 0;
    }

    .creature-desc {
      font-size: 15px;
      line-height: 1.6;
      opacity: 0.85;
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>🧬 Emoji 基因重组器</h2>
    <p>选择不同元素，合成未知的宇宙奇葩生物😎</p>

    <div class="control-panel">
      <div class="selectors">
        <div class="emoji-picker-container">
          <div class="picker-label">属性</div>
          <div class="emoji-selector-btn" onclick="togglePopup('modifier')">
            <span class="current-e" id="display-modifier">💡</span>
            <span class="current-n" id="name-modifier">发光的</span>
          </div>
          <div class="emoji-grid-popup" id="popup-modifier"></div>
        </div>

        <div class="emoji-picker-container">
          <div class="picker-label">本体</div>
          <div class="emoji-selector-btn" onclick="togglePopup('animal')">
            <span class="current-e" id="display-animal">🐱</span>
            <span class="current-n" id="name-animal">猫咪</span>
          </div>
          <div class="emoji-grid-popup" id="popup-animal"></div>
        </div>

        <div class="emoji-picker-container">
          <div class="picker-label">挂件</div>
          <div class="emoji-selector-btn" onclick="togglePopup('object')">
            <span class="current-e" id="display-object">🚀</span>
            <span class="current-n" id="name-object">火箭</span>
          </div>
          <div class="emoji-grid-popup" id="popup-object"></div>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn theme-btn" id="themeToggle" title="切换底色">🌗</button>
        <button class="btn" id="combineBtn">开始融合</button>
      </div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="formula" id="formulaDisplay"></div>
      <h3 class="creature-name" id="nameDisplay"></h3>
      <p class="creature-desc" id="descDisplay"></p>
    </div>
  </div>

  <script>
    const modifiers = [
      { e: '💡', n: '发光的' }, { e: '🔥', n: '喷火的' }, { e: '🥶', n: '冰冻的' },
      { e: '👻', n: '幽灵态' }, { e: '👽', n: '外星产物' }, { e: '😎', n: '嚣张的' },
      { e: '🤡', n: '小丑化的' }, { e: '☢️', n: '核辐射的' }, { e: '🍄', n: '孢子寄生' },
      { e: '🫠', n: '正在融化的' }, { e: '🌈', n: '五彩斑斓的' }, { e: '💩', n: '不可描述的' },
      { e: '🧟', n: '丧尸化的' }, { e: '🤖', n: '机械飞升的' }, { e: '👼', n: '神圣的' }, { e: '🫥', n: '半透明的' },
      { e: '🤢', n: '剧毒的' }, { e: '🤯', n: '精神失常的' }, { e: '🤑', n: '重度氪金的' }, { e: '🥷', n: '潜行的' },
      { e: '👿', n: '深渊堕落的' }, { e: '🥵', n: 'CPU过载的' }, { e: '🥴', n: '喝了假酒的' }, { e: '🤬', n: '祖安狂化的' },
      { e: '🥸', n: '拙劣伪装的' }, { e: '🤕', n: '重度战损的' }, { e: '🤠', n: '西部狂野的' }, { e: '😇', n: '功德圆满的' },
    ];
    const animals = [
      { e: '🐱', n: '猫咪' }, { e: '🐶', n: '修勾' }, { e: '🦖', n: '霸王龙' },
      { e: '🐙', n: '章鱼' }, { e: '🦥', n: '树懒' }, { e: '🦄', n: '独角兽' },
      { e: '🦍', n: '猩猩' }, { e: '🦀', n: '大螃蟹' }, { e: '🐔', n: '坤坤' },
      { e: '🐸', n: '悲伤青蛙' }, { e: '🐿️', n: '松鼠' }, { e: '🦈', n: '鲨鱼' },
      { e: '🪿', n: '战斗大鹅' }, { e: '🦝', n: '干脆面' }, { e: '🦙', n: '羊驼' }, { e: '🐀', n: '卑微鼠鼠' },
      { e: '🦇', n: '吸血蝙蝠' }, { e: '🐛', n: '大青虫' }, { e: '🦉', n: '熬夜猫头鹰' }, { e: '🦔', n: '刺猬' },
      { e: '🪳', n: '南方大蟑螂' }, { e: '🦨', n: '生化臭鼬' }, { e: '🦭', n: '豹子头海豹' }, { e: '🪼', n: '赛博水母' },
      { e: '🦦', n: '吃瓜水獭' }, { e: '🐍', n: '阴险毒蛇' }, { e: '🐷', n: '卑微打工猪' }, { e: '🦚', n: '花里胡哨孔雀' },
    ];
    const objects = [
      { e: '🚀', n: '火箭' }, { e: '🍔', n: '汉堡' }, { e: '🎸', n: '电吉他' },
      { e: '🚽', n: '马桶' }, { e: '💣', n: '定时炸弹' }, { e: '🍉', n: '西瓜' },
      { e: '💻', n: '烂电脑' }, { e: '🛸', n: '飞碟' }, { e: '🪚', n: '电锯' },
      { e: '🍗', n: '炸鸡' }, { e: '📷', n: '相机' }, { e: '🛹', n: '滑板' },
      { e: '💉', n: '可疑针筒' }, { e: '🧻', n: '卫生纸' }, { e: '🪄', n: '魔法棒' }, { e: '🧨', n: '二踢脚' },
      { e: '🛒', n: '购物车' }, { e: '💊', n: '神秘药丸' }, { e: '🗡️', n: '大宝剑' }, { e: '🪃', n: '回旋镖' },
      { e: '🧱', n: '传家宝板砖' }, { e: '🪤', n: '致命捕鼠夹' }, { e: '🧯', n: '干粉灭火器' }, { e: '🔋', n: '鼓包漏电电池' },
      { e: '🪩', n: '迪斯科灯球' }, { e: '🧹', n: '保洁阿姨扫帚' }, { e: '📡', n: '5G脑控天线' }, { e: '🪦', n: '赛博墓碑' },
    ];

    let currentSelection = {
      modifier: modifiers[0],
      animal: animals[0],
      object: objects[0]
    };

    function buildGrid(type, dataArray) {
      const popup = document.getElementById(`popup-${type}`);
      popup.innerHTML = '';

      dataArray.forEach(item => {
        const div = document.createElement('div');
        div.className = 'grid-item';
        div.textContent = item.e;
        div.title = item.n;
        div.onclick = (e) => {
          e.stopPropagation();
          selectEmoji(type, item);
        };
        popup.appendChild(div);
      });
    }

    function togglePopup(type) {
      document.querySelectorAll('.emoji-grid-popup').forEach(el => {
        if (el.id !== `popup-${type}`) el.classList.remove('show');
      });
      const popup = document.getElementById(`popup-${type}`);
      popup.classList.toggle('show');
    }

    function selectEmoji(type, item) {
      currentSelection[type] = item;
      document.getElementById(`display-${type}`).textContent = item.e;
      document.getElementById(`name-${type}`).textContent = item.n;
      document.getElementById(`popup-${type}`).classList.remove('show');
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.emoji-picker-container')) {
        document.querySelectorAll('.emoji-grid-popup').forEach(el => el.classList.remove('show'));
      }
    });

    buildGrid('modifier', modifiers);
    buildGrid('animal', animals);
    buildGrid('object', objects);

    const themeToggle = document.getElementById('themeToggle');
    let isDarkMode = false;
    themeToggle.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      document.body.classList.toggle('dark-mode', isDarkMode);
    });

    const combineBtn = document.getElementById('combineBtn');

    combineBtn.addEventListener('click', async () => {
      const mod = currentSelection.modifier.e;
      const ani = currentSelection.animal.e;
      const obj = currentSelection.object.e;
      const emojis = `${mod} + ${ani} + ${obj}`;

      const resultCard = document.getElementById('resultCard');
      const formulaDisplay = document.getElementById('formulaDisplay');
      const nameDisplay = document.getElementById('nameDisplay');
      const descDisplay = document.getElementById('descDisplay');

      combineBtn.innerText = '⚡ 基因序列重组中...';
      combineBtn.disabled = true;
      formulaDisplay.innerText = emojis;
      nameDisplay.innerText = '正在联机 AI 分析体征...';
      descDisplay.innerText = '';

      resultCard.style.display = 'none';
      setTimeout(() => { resultCard.style.display = 'flex'; }, 10);

      try {
        const workerUrl = 'https://emoji-ai-combiner.acha-xwx.workers.dev';

        const response = await fetch(workerUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emojis })
        });

        const data = await response.json();
        nameDisplay.innerText = data.name;
        descDisplay.innerText = data.desc;

      } catch (error) {
        nameDisplay.innerText = '⚠️ 实验室网络中断';
        descDisplay.innerText = 'Cloudflare 跨次元连接失败，这只生物太强大，烧毁了通讯光缆。';
        console.error(error);
      } finally {
        combineBtn.innerText = '开始融合';
        combineBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
